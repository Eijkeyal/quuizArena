name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./quiz backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./quiz backend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check server.js

  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./quiz frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "./quiz frontend/package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
  # Build & push Docker images

  docker-build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    needs: [backend, frontend]

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./quiz backend
          file: ./quiz backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./quiz frontend
          file: ./quiz frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=http://localhost:3000
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/quiz-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
